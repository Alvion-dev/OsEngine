name: probe

# Can OsEngine be driven headlessly on a hosted Windows runner?
#
# The whole calibration plan depends on this one unknown. OsEngine is a WPF
# application and its MCP server lives inside MainWindow, so the server only
# exists if the window does. GitHub's Windows runners have a desktop session but
# nobody is logged in at it, and that is exactly the case that decides whether a
# WPF app starts or dies on launch.
#
# Nothing here trades, connects to a broker, or needs a credential. It builds,
# starts the application, and asks its MCP server to say hello.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build OsEngine
        working-directory: project
        run: dotnet build OsEngine/OsEngine.csproj -c Release -v minimal

      - name: Turn the MCP server on before first launch
        working-directory: project
        shell: pwsh
        run: |
          # McpSettings reads Engine\McpSettings.txt line by line: port, api key,
          # enabled, full log, allowed IPs. Written here because the only other
          # way to enable it is a checkbox in a window nobody can click.
          $out = Get-ChildItem -Recurse -Filter OsEngine.exe -Path OsEngine/bin | Select-Object -First 1
          if (-not $out) { throw "OsEngine.exe not found after build" }
          $dir = $out.Directory.FullName
          Write-Host "built at: $dir"
          New-Item -ItemType Directory -Force -Path "$dir\Engine" | Out-Null
          Set-Content -Path "$dir\Engine\McpSettings.txt" -Value @(
            "6500",
            "osengine-mcp-default-key",
            "true",
            "true",
            ""
          )
          "OSENGINE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start OsEngine and ask its MCP server to say hello
        shell: pwsh
        run: |
          $exe = Join-Path $env:OSENGINE_DIR "OsEngine.exe"
          Write-Host "starting $exe"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $env:OSENGINE_DIR -PassThru
          Write-Host "pid: $($proc.Id)"

          $body = @{
            jsonrpc = "2.0"; id = 1; method = "initialize"
            params = @{
              protocolVersion = "2024-11-05"
              capabilities = @{}
              clientInfo = @{ name = "calibration-probe"; version = "1.0.0" }
            }
          } | ConvertTo-Json -Depth 6

          $deadline = (Get-Date).AddMinutes(6)
          $answered = $false
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Host "!! OsEngine exited on its own, code $($proc.ExitCode)"
              break
            }
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                    -ContentType "application/json" -Body $body `
                    -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 10
              Write-Host "MCP answered:"
              $r | ConvertTo-Json -Depth 8
              $answered = $true
              break
            } catch {
              $status = $null
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              if ($status) {
                # The server answered. That is not "not ready" -- it is a wrong
                # request, and retrying it for six minutes teaches nothing.
                Write-Host "!! MCP answered HTTP $status -- the server is up and rejected the request"
                Write-Host $_.ErrorDetails.Message
                break
              }
              Start-Sleep -Seconds 5
            }
          }

          if (-not $answered) {
            Write-Host "=== listening ports ==="
            netstat -ano | Select-String "LISTEN" | Select-Object -First 40
            Write-Host "=== process alive? ==="
            Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Format-List Id,ProcessName,Responding
          }

          "MCP_ANSWERED=$answered" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Open the tester and see if the factory knows our robots
        if: env.MCP_ANSWERED == 'True'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          function Call($name, $toolArgs, $id) {
            $body = @{ jsonrpc = "2.0"; id = $id; method = "tools/call"
                       params = @{ name = $name; arguments = $toolArgs } } | ConvertTo-Json -Depth 8
            Write-Host ">>> $name $(($toolArgs | ConvertTo-Json -Compress))"
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                    -ContentType "application/json" -Body $body `
                    -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 60
              $r | ConvertTo-Json -Depth 25 | Set-Content "artifacts/$name.json" -Encoding utf8
              $err = $r.result.IsError
              Write-Host "--- $name : $(if ($err) { 'REFUSED' } else { 'ok' })"
              if ($err) { Write-Host "    $($r.result.Content[0].Text)" }
              return $r
            } catch {
              Write-Host "--- $name : HTTP FAILURE $($_.Exception.Message)"
              return $null
            }
          }

          # bot_get_list needs a mode that supports robots; without it the
          # refusal reads like a missing robot rather than a missing terminal.
          Call "terminal_launch" @{ mode = "tester" } 10 | Out-Null
          Start-Sleep -Seconds 25
          Call "terminal_get_status" @{} 11 | Out-Null
          Call "bot_get_list" @{} 12 | Out-Null

          # The real question: can the factory build what we added? A robot the
          # compiler accepted but the factory never registered is invisible here.
          foreach ($bot in @("CalibBuyAndHold", "CalibRandomEntry", "CalibLookahead")) {
            Call "bot_create" @{ name = "probe$bot"; strategy_name = $bot } (100 + $bot.Length) | Out-Null
          }
          Call "bot_get_list" @{} 20 | Out-Null

      - name: Save the whole tool surface, schemas and all
        if: env.MCP_ANSWERED == 'True'
        shell: pwsh
        run: |
          # The names alone are not enough to drive it: each tool has an input
          # schema, and guessing argument shapes costs a runner round trip each
          # time. Take the lot once and design against it offline.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $body = @{ jsonrpc = "2.0"; id = 2; method = "tools/list"; params = @{} } | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                -ContentType "application/json" -Body $body `
                -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 30
          $r.result | ConvertTo-Json -Depth 30 | Set-Content -Path artifacts/tools.json -Encoding utf8
          Write-Host "tools offered: $($r.result.tools.Count)"

          # What data sets exist out of the box, and what the tester thinks it
          # is configured with right now. Both are needed before loading history.
          foreach ($call in @("data_get_sets", "tester_data_get_config", "tester_execution_get_config", "tester_portfolio_get_config")) {
            $b = @{ jsonrpc = "2.0"; id = 3; method = "tools/call"
                    params = @{ name = $call; arguments = @{} } } | ConvertTo-Json -Depth 6
            try {
              $resp = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                        -ContentType "application/json" -Body $b `
                        -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 30
              $resp | ConvertTo-Json -Depth 20 | Set-Content -Path "artifacts/$call.json" -Encoding utf8
              Write-Host "--- $call : answered"
            } catch {
              Write-Host "--- $call : FAILED $($_.Exception.Message)"
            }
          }

      - name: Collect whatever it wrote down
        if: always()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Recurse -Path $env:OSENGINE_DIR -Include MCPLog*.txt,*.log `
                    -ErrorAction SilentlyContinue | Select-Object -First 20
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($l in $logs) { Copy-Item $l.FullName -Destination artifacts -ErrorAction SilentlyContinue }
          Get-ChildItem artifacts | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osengine-probe-logs
          path: artifacts
          if-no-files-found: ignore
