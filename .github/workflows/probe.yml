name: probe

# Can OsEngine be driven headlessly on a hosted Windows runner?
#
# The whole calibration plan depends on this one unknown. OsEngine is a WPF
# application and its MCP server lives inside MainWindow, so the server only
# exists if the window does. GitHub's Windows runners have a desktop session but
# nobody is logged in at it, and that is exactly the case that decides whether a
# WPF app starts or dies on launch.
#
# Nothing here trades, connects to a broker, or needs a credential. It builds,
# starts the application, and asks its MCP server to say hello.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build OsEngine
        working-directory: project
        run: dotnet build OsEngine/OsEngine.csproj -c Release -v minimal

      - name: Turn the MCP server on before first launch
        working-directory: project
        shell: pwsh
        run: |
          # McpSettings reads Engine\McpSettings.txt line by line: port, api key,
          # enabled, full log, allowed IPs. Written here because the only other
          # way to enable it is a checkbox in a window nobody can click.
          # The repository ships 665 prebuilt files under bin/Debug. Searching
          # bin/ and taking the first match started that committed binary --
          # built long before our robots existed -- while the fresh Release
          # output sat untouched. The build passed and the robots were missing,
          # and the error said "Unknown strategy".
          $out = Get-ChildItem -Recurse -Filter OsEngine.exe -Path OsEngine/bin/Release |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $out) { throw "no Release build of OsEngine.exe found" }
          $age = (Get-Date) - $out.LastWriteTime
          Write-Host "built at: $($out.Directory.FullName)"
          Write-Host "exe written: $($out.LastWriteTime) ($([int]$age.TotalMinutes) min ago)"
          if ($age.TotalMinutes -gt 30) {
            throw "OsEngine.exe is $([int]$age.TotalMinutes) min old -- this is not the build we just made"
          }
          $dir = $out.Directory.FullName
          New-Item -ItemType Directory -Force -Path "$dir\Engine" | Out-Null
          Set-Content -Path "$dir\Engine\McpSettings.txt" -Value @(
            "6500",
            "osengine-mcp-default-key",
            "true",
            "true",
            ""
          )
          "OSENGINE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start OsEngine and ask its MCP server to say hello
        shell: pwsh
        run: |
          $exe = Join-Path $env:OSENGINE_DIR "OsEngine.exe"
          Write-Host "starting $exe"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $env:OSENGINE_DIR -PassThru
          Write-Host "pid: $($proc.Id)"

          $body = @{
            jsonrpc = "2.0"; id = 1; method = "initialize"
            params = @{
              protocolVersion = "2024-11-05"
              capabilities = @{}
              clientInfo = @{ name = "calibration-probe"; version = "1.0.0" }
            }
          } | ConvertTo-Json -Depth 6

          $deadline = (Get-Date).AddMinutes(6)
          $answered = $false
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Host "!! OsEngine exited on its own, code $($proc.ExitCode)"
              break
            }
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                    -ContentType "application/json" -Body $body `
                    -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 10
              Write-Host "MCP answered:"
              $r | ConvertTo-Json -Depth 8
              $answered = $true
              break
            } catch {
              $status = $null
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              if ($status) {
                # The server answered. That is not "not ready" -- it is a wrong
                # request, and retrying it for six minutes teaches nothing.
                Write-Host "!! MCP answered HTTP $status -- the server is up and rejected the request"
                Write-Host $_.ErrorDetails.Message
                break
              }
              Start-Sleep -Seconds 5
            }
          }

          if (-not $answered) {
            Write-Host "=== listening ports ==="
            netstat -ano | Select-String "LISTEN" | Select-Object -First 40
            Write-Host "=== process alive? ==="
            Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Format-List Id,ProcessName,Responding
          }

          "MCP_ANSWERED=$answered" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Save the whole tool surface, schemas and all
        if: env.MCP_ANSWERED == 'True'
        shell: pwsh
        run: |
          # The names alone are not enough to drive it: each tool has an input
          # schema, and guessing argument shapes costs a runner round trip each
          # time. Take the lot once and design against it offline.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $body = @{ jsonrpc = "2.0"; id = 2; method = "tools/list"; params = @{} } | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                -ContentType "application/json" -Body $body `
                -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 30
          $r.result | ConvertTo-Json -Depth 30 | Set-Content -Path artifacts/tools.json -Encoding utf8
          Write-Host "tools offered: $($r.result.tools.Count)"

      # The order below is not ours. It is the order in the project's own
      # end-to-end test, Tests/McpTestStand/.../Tests/TesterTests.cs, method
      # TestRunSimulation. Every earlier attempt here was an invented order and
      # every one of them failed in a way that read like a broken engine.
      - name: Calibration — answers known before the tester runs
        if: env.MCP_ANSWERED == 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # Sergey's actual tariff, 0.05% of turnover, confirmed 2026-08-13.
          # A backtest run on a made-up commission is not a cheap approximation,
          # it is a different answer.
          $commissionPercent = 0.05

          $script:callId = 0
          function Call($name, $toolArgs) {
            $script:callId++
            $body = @{ jsonrpc = "2.0"; id = $script:callId; method = "tools/call"
                       params = @{ name = $name; arguments = $toolArgs } } | ConvertTo-Json -Depth 10
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:6500/api/v1/mcp" -Method Post `
                    -ContentType "application/json" -Body $body `
                    -Headers @{ "X-Api-Key" = "osengine-mcp-default-key" } -TimeoutSec 180
              return $r
            } catch {
              Write-Host "!!! $name : HTTP FAILURE $($_.Exception.Message)"
              return $null
            }
          }

          # Every payload is a JSON string nested inside result.Content[0].Text.
          # Reading result directly gives an object that is always "there" and
          # always empty, which is how a refusal passes for a success.
          function Payload($r) {
            if (-not $r) { return $null }
            if ($r.result.IsError) { return $null }
            if (-not $r.result.Content) { return $null }
            return ($r.result.Content[0].Text | ConvertFrom-Json)
          }

          function Say($name, $r) {
            if (-not $r) { Write-Host "--- $name : no response"; return }
            if ($r.result.IsError) { Write-Host "--- $name : REFUSED -- $($r.result.Content[0].Text)"; return }
            $t = $r.result.Content[0].Text
            if ($t.Length -gt 400) { $t = $t.Substring(0, 400) + " ..." }
            Write-Host "--- $name : $t"
          }

          function WaitTesterServer {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              $r = Call "tester_data_get_config" @{}
              if ($r -and -not $r.result.IsError) { return }
              Start-Sleep -Milliseconds 500
            }
            throw "tester server did not answer"
          }

          # Creates the robot, turns it on, binds the first Simple tab to the
          # security the tester actually loaded, and sets the commission.
          function NewCalibBot($strategy, $params) {
            $bot = Payload (Call "bot_create" @{ strategy_name = $strategy })
            if (-not $bot) { throw "bot_create refused for $strategy" }
            $name = $bot.name

            $prm = Payload (Call "bot_set_params" @{ bot_id = $name; parameters = $params })
            if (-not $prm) { throw "bot_set_params refused for $name" }
            if ($prm.updated_count -ne $params.Count) {
              throw "$name : asked to set $($params.Count) parameters, engine updated $($prm.updated_count)"
            }

            $srcs = Payload (Call "bot_get_sources" @{ bot_id = $name })
            $tabName = ($srcs.sources | Where-Object { $_.type -eq "Simple" } | Select-Object -First 1).name
            if (-not $tabName) { throw "$name has no Simple tab" }

            $tab = Payload (Call "bot_set_config_tab_simple" @{
              bot_id = $name; tab_name = $tabName
              server_type = "Tester"; portfolio_name = "GodMode"
              security_class = $script:securityClass; security_name = $script:securityName
              commission_type = "Percent"; commission_value = $commissionPercent
              time_frame = "Day" })
            if (-not $tab) { throw "bot_set_config_tab_simple refused for $name" }
            if ($tab.commission_value -ne $commissionPercent) {
              throw "$name : commission read back as $($tab.commission_value), asked for $commissionPercent"
            }
            Write-Host "  robot $name ($strategy) on $($tab.security_name), commission $($tab.commission_type) $($tab.commission_value)"
            return $name
          }

          function RunTester {
            # TestingStart() refuses outright while _lastStartSecurityTime + 5s
            # is still in the future, and again -- silently -- while securities
            # are joining the session. Retrying until Play is their answer.
            Start-Sleep -Seconds 7
            $playing = $false
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              $st = Payload (Call "tester_start" @{ fast_forward = $true })
              if ($st -and $st.regime -eq "Play") { $playing = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $playing) { throw "tester did not reach Play in 120s" }

            # fast_forward on tester_start is best-effort; tester_fast_forward
            # is a toggle, so check the state before pressing it.
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              $st = Payload (Call "tester_get_status" @{})
              if ($st -and $st.fast_forward) { break }
              Call "tester_fast_forward" @{} | Out-Null
              Start-Sleep -Milliseconds 200
            }

            # Done means paused at the end of the data, not simply paused.
            $deadline = (Get-Date).AddSeconds(600)
            while ((Get-Date) -lt $deadline) {
              $st = Payload (Call "tester_get_status" @{})
              if ($st) {
                if ($st.regime -eq "Pause" -and [datetime]$st.time_now -ge [datetime]$st.time_end) {
                  Write-Host "  simulation finished at $($st.time_now)"
                  return
                }
                if ($st.regime -eq "NotActive") { throw "tester stopped unexpectedly" }
              }
              Start-Sleep -Seconds 5
            }
            throw "tester did not finish in 600s"
          }

          function ClosedPositions($botName) {
            $all = @()
            $offset = 0
            while ($true) {
              $page = Payload (Call "bot_journal_get_closed_positions" @{
                bot_name = $botName; include_failed = $false; limit = 500; offset = $offset })
              if (-not $page -or $page.count -eq 0) { break }
              $all += $page.positions
              if ($page.positions.Count -lt 500) { break }
              $offset += 500
            }
            return ,$all
          }

          # Every closed position must be charged (entry + close) * rate on both
          # sides, and its profit must be that gross move less that charge. This
          # is exact arithmetic -- no sample size, no noise, no judgement.
          function CheckEveryPosition($positions) {
            $problems = @()
            $sumGross = 0.0; $sumFee = 0.0; $sumNet = 0.0
            $grossLong = 0.0; $grossShort = 0.0; $longs = 0; $shorts = 0
            foreach ($p in $positions) {
              $fee = ($p.entry_price + $p.close_price) * $p.volume * $commissionPercent / 100
              $gross = if ($p.direction -eq "Long") { ($p.close_price - $p.entry_price) * $p.volume }
                       else { ($p.entry_price - $p.close_price) * $p.volume }
              $net = $gross - $fee
              $sumGross += [double]$gross; $sumFee += [double]$fee; $sumNet += [double]$net
              if ($p.direction -eq "Long") { $grossLong += [double]$gross; $longs++ }
              else { $grossShort += [double]$gross; $shorts++ }

              if ([math]::Abs($p.commission - $fee) -gt 0.0001) {
                $problems += "position $($p.number): commission $($p.commission), expected $([math]::Round($fee,5))" }
              if ([math]::Abs($p.profit_abs - $net) -gt 0.01) {
                $problems += "position $($p.number): profit_abs $($p.profit_abs), expected $([math]::Round($net,5))" }
              if ($problems.Count -ge 5) { break }
            }
            return [pscustomobject]@{
              problems = $problems; gross = $sumGross; fee = $sumFee; net = $sumNet
              grossLong = $grossLong; grossShort = $grossShort
              longs = $longs; shorts = $shorts; count = $positions.Count }
          }

          # ---------------------------------------------------------------
          # Quotes. TesterServer.LoadCandleFromFolder calls
          # Directory.GetFiles(folder) -- not recursive. Pointing at the parent
          # of the files loads nothing, the tester keeps TimeStart at
          # DateTime.MinValue, and TestingStart() returns before reaching Play.
          # That was the whole of the earlier "NotActive / 0001-01-01 / zero deals".
          $src = Join-Path $env:GITHUB_WORKSPACE "calibration-data\Daily"
          if (-not (Test-Path $src)) { throw "quotes folder $src is missing from the checkout" }
          $data = Join-Path $env:OSENGINE_DIR "CalibData"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Copy-Item "$src\*" -Destination $data -Force
          $rows = @(Get-Content (Join-Path $data "SBER") | ForEach-Object {
            $f = $_.Split(","); [pscustomobject]@{ d = $f[0]; open = [decimal]$f[2]; close = [decimal]$f[5] } })
          Write-Host "quotes: $($rows.Count) daily candles, $($rows[0].d)..$($rows[-1].d)"

          # The noise band for the random-entry check is measured here, not
          # guessed. A guessed volatility makes the band wrong in an unknown
          # direction, which turns "outside the band" into a statement about
          # the guess rather than about the engine.
          $moves = @(for ($i = 1; $i -lt $rows.Count; $i++) { [double]($rows[$i].open - $rows[$i-1].open) })
          $moveStats = $moves | Measure-Object -Average -StandardDeviation
          $moveSd = $moveStats.StandardDeviation
          Write-Host ("open-to-open move: mean {0} RUB, sd {1} RUB" -f `
            [math]::Round($moveStats.Average,4), [math]::Round($moveSd,4))

          # Open the tester inside the running window. terminal_launch restarts
          # the process; the tester server then never comes up.
          Say "terminal_open_mode" (Call "terminal_open_mode" @{ mode = "tester" })
          WaitTesterServer
          Write-Host "tester server is up"

          # Source first, dates later. LoadSecurities() resets TimeStart to
          # MinValue and recomputes it from the data, so dates sent in the same
          # call are overwritten by the reload that call triggers.
          Say "data source" (Call "tester_data_set_config" @{
            source_type = "Folder"; folder_path = $data
            type_tester_data = "Candle"; delete_trades_from_memory = $true })

          # The reload runs on a worker thread. Ask the tester what it has.
          $script:securityName = ""; $script:securityClass = ""
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $p = Payload (Call "tester_get_securities" @{})
            if ($p -and $p.count -gt 0) {
              $script:securityName  = $p.securities[0].name
              $script:securityClass = $p.securities[0].class_name
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $script:securityName) { throw "tester loaded no securities from $data" }
          Write-Host "tester loaded '$($script:securityName)' / '$($script:securityClass)'"

          # Now the dates stick: same source, no reload. date_to is a day past
          # the last candle -- LoadNextData pauses the moment TimeNow passes
          # TimeEnd, and the candles carry a 10:00 stamp.
          Say "dates" (Call "tester_data_set_config" @{
            date_from = "2024-01-03T00:00:00"; date_to = "2026-07-01T00:00:00" })
          Say "portfolio" (Call "tester_portfolio_set_config" @{
            start_portfolio = 1000000; portfolio_calculation_enabled = $true })
          Say "execution" (Call "tester_execution_set_config" @{
            slippage_to_simple_order = 0; slippage_to_stop_order = 0
            order_execution_type = "Touch" })

          $failures = @()

          # ===============================================================
          # 1. Buy and hold. The answer is fixed by arithmetic before the
          #    tester is asked: the price move, less one round trip of costs.
          # ===============================================================
          Write-Host ""
          Write-Host "=== 1. BUY AND HOLD ==="
          $exitDate = "20260625"
          $exitDashed = ([datetime]::ParseExact($exitDate, "yyyyMMdd", $null)).ToString("yyyy-MM-dd")
          $bh = NewCalibBot "CalibBuyAndHold" @{
            "Regime" = "On"; "Volume" = 1; "Exit date yyyy-MM-dd" = $exitDashed }
          RunTester
          $bhPositions = ClosedPositions $bh
          if ($bhPositions.Count -ne 1) {
            $failures += "buy and hold: expected exactly 1 closed position, got $($bhPositions.Count)"
          } else {
            $p = $bhPositions[0]
            Write-Host ($p | ConvertTo-Json -Depth 6)

            # Three separate claims, each read out of the engine's source:
            #   a) a fill happens at the OPEN of a candle -- CheckCandles emits
            #      open/high/low/close as trades, then raises candle-finished;
            #   b) so an order placed on candle N fills on candle N+1. Checked
            #      on the exit, whose date we chose;
            #   c) commission is (entry + close) * rate, both sides.
            # The entry is deliberately not pinned to a candle we picked: the
            # first candle of the series warms it up and never reaches the
            # robot, so counting from the file would encode a guess.
            $openDay  = ([datetime]$p.open_time).ToString("yyyyMMdd")
            $closeDay = ([datetime]$p.close_time).ToString("yyyyMMdd")
            $expEntry = ($rows | Where-Object { $_.d -eq $openDay }).open
            $expExit  = ($rows | Where-Object { $_.d -eq $closeDay }).open
            $shouldCloseOn = ($rows | Where-Object { $_.d -gt $exitDate } | Select-Object -First 1).d

            if ($closeDay -ne $shouldCloseOn) {
              $failures += "buy and hold: closed on $closeDay; an order placed when $exitDate finished must fill on $shouldCloseOn" }
            if ([math]::Abs($p.entry_price - $expEntry) -gt 0.0001) {
              $failures += "buy and hold: entry_price $($p.entry_price) is not the open of $openDay ($expEntry)" }
            if ([math]::Abs($p.close_price - $expExit) -gt 0.0001) {
              $failures += "buy and hold: close_price $($p.close_price) is not the open of $closeDay ($expExit)" }

            $r = CheckEveryPosition $bhPositions
            $failures += $r.problems | ForEach-Object { "buy and hold: $_" }
            Write-Host ("  gross {0}  fee {1}  net {2}" -f `
              [math]::Round($r.gross,5), [math]::Round($r.fee,5), [math]::Round($r.net,5))
            if ($r.fee -le 0) { $failures += "buy and hold: no commission charged on a completed round trip" }
          }

          # ===============================================================
          # 2. Random entry. No edge by construction, so over many trades the
          #    result must be the cost of the turnover and nothing else.
          # ===============================================================
          Write-Host ""
          Write-Host "=== 2. RANDOM ENTRY ==="

          # Run several seeds rather than one. A single run cannot tell chance
          # from a systematic tilt in the engine: the first attempt came out
          # +142.77 gross, 1.94 standard deviations above zero, which is both
          # "unremarkable" and "worth checking" depending on which story you
          # already believe. Across seeds the two stories separate -- chance
          # scatters around zero, a tilt lands on the same side every time.
          $seeds = @(20260812, 1, 7, 42, 1917, 31337, 90210, 271828)
          $results = @()
          $previousBot = $bh

          foreach ($seed in $seeds) {
            Call "tester_stop" @{} | Out-Null
            Call "bot_delete" @{ bot_id = $previousBot } | Out-Null
            WaitTesterServer

            # Enter every candle, hold one: the shortest cycle this data allows,
            # which is what maximises the trade count on 633 daily candles.
            $re = NewCalibBot "CalibRandomEntry" @{
              "Regime" = "On"; "Volume" = 1; "Seed" = $seed
              "Hold candles" = 1; "Try entry every N candles" = 1 }
            $previousBot = $re
            RunTester
            $rePositions = ClosedPositions $re

            if ($rePositions.Count -lt 100) {
              $failures += "random entry seed ${seed}: only $($rePositions.Count) trades -- too few for costs to show above price noise"
              continue
            }

            $r = CheckEveryPosition $rePositions
            $failures += $r.problems | ForEach-Object { "random entry seed ${seed}: $_" }
            if ($r.fee -le 0) {
              $failures += "random entry seed ${seed}: $($rePositions.Count) round trips and no commission at all"
            }
            $results += $r
            Write-Host ("  seed {0,-8} trades {1,4}  long/short {2}/{3}  gross {4,8}  fee {5,7}  net {6,8}" -f `
              $seed, $r.count, $r.longs, $r.shorts,
              [math]::Round($r.gross,2), [math]::Round($r.fee,2), [math]::Round($r.net,2))
            Write-Host ("            of which long {0}  short {1}" -f `
              [math]::Round($r.grossLong,2), [math]::Round($r.grossShort,2))
          }

          if ($results.Count -ge 3) {
            $grosses = @($results | ForEach-Object { $_.gross })
            $avgTrades = ($results | ForEach-Object { $_.count } | Measure-Object -Average).Average
            # Under the null each trade is one open-to-open move with a random
            # sign, so a run's gross has sd = moveSd * sqrt(trades), and the
            # average of k runs narrows that by sqrt(k).
            $runSd  = $moveSd * [math]::Sqrt($avgTrades)
            $meanSd = $runSd / [math]::Sqrt($results.Count)
            $mean   = ($grosses | Measure-Object -Average).Average
            $positive = @($grosses | Where-Object { $_ -gt 0 }).Count

            Write-Host ""
            Write-Host ("  across $($results.Count) seeds: mean gross {0}, expected spread of one run +/-{1}" -f `
              [math]::Round($mean,2), [math]::Round($runSd,2))
            Write-Host ("  mean is {0} sd from zero ({1} of $($results.Count) runs positive)" -f `
              [math]::Round($mean / $meanSd, 2), $positive)
            Write-Host ("  costs took {0} per round trip on average" -f `
              [math]::Round(($results | ForEach-Object { $_.fee / $_.count } | Measure-Object -Average).Average, 4))

            # Three sd on the mean of several independent seeds is no longer a
            # story about luck. It would mean the engine gives coin-flip trades
            # an edge, and every result it ever reports would inherit that.
            if ([math]::Abs($mean / $meanSd) -gt 3) {
              $failures += ("random entry: mean gross {0} over $($results.Count) seeds is {1} sd from zero -- coin flips are not supposed to have an edge" -f `
                [math]::Round($mean,2), [math]::Round($mean / $meanSd, 2))
            }
          }

          # ===============================================================
          # 3. Lookahead. A robot that is openly cheating must produce numbers
          #    nobody could reach honestly. If it does not, the yardstick is
          #    broken and every later "this looks too good" has nothing to be
          #    measured against.
          # ===============================================================
          Write-Host ""
          Write-Host "=== 3. LOOKAHEAD ==="
          # The coin-flip spread is the yardstick below. If section 2 did not
          # produce it, fall back to the same formula on the trade count this
          # robot will make, rather than dividing by nothing later.
          if (-not $runSd) { $runSd = $moveSd * [math]::Sqrt(315) }
          $futureFile = Join-Path $env:OSENGINE_DIR "calib-future.csv"
          if (Test-Path $futureFile) { Remove-Item $futureFile -Force }

          # Pass one records; it trades nothing.
          Call "tester_stop" @{} | Out-Null
          Call "bot_delete" @{ bot_id = $previousBot } | Out-Null
          WaitTesterServer
          $rec = NewCalibBot "CalibLookahead" @{
            "Regime" = "Record"; "Volume" = 1; "File" = "calib-future.csv" }
          RunTester
          if (-not (Test-Path $futureFile)) {
            $failures += "lookahead: the Record pass wrote no file at $futureFile"
          } else {
            $recorded = @(Get-Content $futureFile)
            Write-Host "  recorded $($recorded.Count) candles the robot actually saw"
            $recPositions = ClosedPositions $rec
            if ($recPositions.Count -ne 0) {
              $failures += "lookahead: the Record pass traded $($recPositions.Count) times; it is supposed to only watch"
            }

            # Pass two trades on it.
            Call "tester_stop" @{} | Out-Null
            Call "bot_delete" @{ bot_id = $rec } | Out-Null
            WaitTesterServer
            $che = NewCalibBot "CalibLookahead" @{
              "Regime" = "Cheat"; "Volume" = 1; "File" = "calib-future.csv" }
            RunTester
            $chePositions = ClosedPositions $che
            Write-Host "  closed positions: $($chePositions.Count)"

            if ($chePositions.Count -lt 100) {
              $failures += "lookahead: only $($chePositions.Count) trades -- the Cheat pass did not read the future back"
            } else {
              $r = CheckEveryPosition $chePositions
              $failures += $r.problems | ForEach-Object { "lookahead: $_" }

              # Win rate is scale-free, so it does not depend on position size
              # or on what fraction of the portfolio was deployed. Reported both
              # ways on purpose: gross shows whether the direction was foreseen,
              # net shows how many correct calls the commission still turned
              # into losses.
              $winners      = @($chePositions | Where-Object { $_.profit_abs -gt 0 }).Count
              $grossWinners = @($chePositions | Where-Object {
                $g = if ($_.direction -eq "Long") { $_.close_price - $_.entry_price }
                     else { $_.entry_price - $_.close_price }
                $g -gt 0 }).Count
              $winRate = $winners / $chePositions.Count
              $grossWinRate = $grossWinners / $chePositions.Count

              # Both ends taken by min/max rather than by position in the list.
              # The journal hands positions back newest first, so reading the
              # ends off the array gave a span of MINUS 2.46 years.
              $firstOpen = ($chePositions | ForEach-Object { [datetime]$_.open_time }  | Measure-Object -Minimum).Minimum
              $lastClose = ($chePositions | ForEach-Object { [datetime]$_.close_time } | Measure-Object -Maximum).Maximum
              $years = ($lastClose - $firstOpen).Days / 365.25
              $avgEntry = ($chePositions | ForEach-Object { [double]$_.entry_price } | Measure-Object -Average).Average
              $annualPct = ($r.net / $avgEntry) * 100 / $years

              Write-Host ("  gross {0}  fee {1}  net {2}" -f `
                [math]::Round($r.gross,2), [math]::Round($r.fee,2), [math]::Round($r.net,2))
              Write-Host ("  win rate {0}% net, {1}% gross ({2} of {3})" -f `
                [math]::Round($winRate * 100, 1), [math]::Round($grossWinRate * 100, 1),
                $winners, $chePositions.Count)
              Write-Host ("  {0} correct calls that the commission still turned into losses" -f `
                ($grossWinners - $winners))
              Write-Host ("  on capital at risk ({0} RUB a trade): {1}% a year over {2} years" -f `
                [math]::Round($avgEntry,2), [math]::Round($annualPct,1), [math]::Round($years,2))

              # The yardstick is the honest robots on this same data, not an
              # absolute percentage. A fixed "200% a year is impossible" encodes
              # assumptions about position size and turnover that change with
              # every setup -- and it failed here at 106% a year, which is
              # simply what perfect foresight of one-day moves is worth on daily
              # candles at half duty cycle. The number was mine, not the
              # engine's.
              #
              # Against the coin flip on the same candles the signal is
              # unmistakable, and that comparison carries no assumptions at all.
              $sigmas = $r.gross / $runSd
              Write-Host ("  gross is {0} sigma of the coin-flip spread (+/-{1})" -f `
                [math]::Round($sigmas, 1), [math]::Round($runSd, 2))

              if ($grossWinRate -lt 0.98) {
                $failures += ("lookahead: gross win rate only {0}% -- a robot reading its own fills should get the direction right nearly every time, so either the cheat is not landing or the engine is doing something to the signal" -f `
                  [math]::Round($grossWinRate * 100, 1))
              }
              if ($sigmas -lt 5) {
                $failures += ("lookahead: gross is only {0} sigma above the coin flip -- too close to honest to serve as a yardstick" -f `
                  [math]::Round($sigmas, 1))
              }

              Write-Host ""
              Write-Host ("  YARDSTICK: on this data perfect foresight is worth {0}% a year." -f `
                [math]::Round($annualPct, 0))
              Write-Host  "  Any honest strategy on this data approaching that is leaking, not winning."
            }
          }

          # ===============================================================
          Write-Host ""
          if ($failures.Count -gt 0) {
            Write-Host "=== FAILURES ==="
            $failures | ForEach-Object { Write-Host "  $_" }
            throw "calibration disagreed with arithmetic"
          }
          Write-Host "=== every check agreed with arithmetic ==="
      - name: Collect whatever it wrote down
        if: always()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Recurse -Path $env:OSENGINE_DIR -Include MCPLog*.txt,*.log `
                    -ErrorAction SilentlyContinue | Select-Object -First 20
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($l in $logs) { Copy-Item $l.FullName -Destination artifacts -ErrorAction SilentlyContinue }
          Get-ChildItem artifacts | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osengine-probe-logs
          path: artifacts
          if-no-files-found: ignore
